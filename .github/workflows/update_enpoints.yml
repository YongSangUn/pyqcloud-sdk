name: Update API Endpoints

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00 运行
  workflow_dispatch: # 允许手动触发

jobs:
  update-endpoints:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以确保分支操作正常

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tencentcloud-sdk-python

      - name: Create update branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH_NAME="update/endpoints-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Update endpoints
        run: |
          python scripts/update_endpoints.py src/pyqcloud_sdk src/pyqcloud_sdk/data

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add src/pyqcloud_sdk/data/endpoints.json src/pyqcloud_sdk/data/.sdk-version
          git commit -m "chore: update API endpoints and SDK version"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          title: "chore: update API endpoints and SDK version"
          body: |
            自动更新 API endpoints 和 SDK 版本

            - 更新 endpoints.json
            - 更新 .sdk-version
          branch: ${{ env.BRANCH_NAME }}
          base: main
          labels: automated pr
          delete-branch: true
