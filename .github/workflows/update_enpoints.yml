name: Update API Endpoints

on:
  # Check upstream SDK updates periodically
  schedule:
    - cron: "0 0 * * 1" # Run every Monday
  # Support manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update"
        required: false
        default: false

jobs:
  check-sdk-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Checkout TencentCloud SDK
        uses: actions/checkout@v2
        with:
          repository: TencentCloud/tencentcloud-sdk-python
          ref: master
          path: tencentcloud-sdk-python

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Check SDK Version and Update Endpoints
        id: check-version
        run: |
          current_version=$(grep -oP "(?<=__version__ = ['\"])[^'\"]*(?=['\"])" tencentcloud-sdk-python/tencentcloud/__init__.py 2>/dev/null)
          local_version=$(cat src/pyqcloud_sdk/data/.sdk-version)
          if [ "$current_version" != "$local_version" ] && [ "$(printf '%s\n' "$local_version" "$current_version" | sort -V | head -n1)" = "$local_version" ]; then
            echo "version=$current_version" >> $GITHUB_OUTPUT
            echo "updated=true" >> $GITHUB_OUTPUT
            # Update API info
            python scripts/update_endpoints.py tencentcloud-sdk-python/tencentcloud src/pyqcloud_sdk/data
          else
            echo "version=$local_version" >> $GITHUB_OUTPUT
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      # - name: Test SDK
      #   if: steps.check-version.outputs.updated == 'true'
      #   run: |
      #     pip install -e.
      #     python -m pytest tests/

      - name: Create Pull Request
        if: steps.check-version.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: "chore: update API endpoints and version to ${{ steps.check-version.outputs.version }}"
          title: "chore: update API endpoints and version to ${{ steps.check-version.outputs.version }}"
          body: |
            Automatically update API endpoints data
            - SDK Version: ${{ steps.check-version.outputs.version }}
            - Update Time: ${{ github.event.timestamp }}

            Updates:
            1. Update endpoints.json
            2. Update version in pyproject.toml
          branch: update-endpoints
          base: main
