name: Update API Endpoints

on:
  # Check upstream SDK updates periodically
  schedule:
    - cron: "0 0 * * 1" # Run every Monday
  # Support manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update"
        required: false
        default: false

jobs:
  check-sdk-update:
    runs-on: ubuntu-latest
    outputs:
      sdk_updated: ${{ steps.check-version.outputs.updated }}
      new_version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Check SDK Version
        id: check-version
        run: |
          current_version=$(pip index versions tencentcloud-sdk-python | grep -m1 'Available versions:' | grep -oP '\d+\.\d+\.\d+' | head -1)
          local_version=$(cat src/pyqcloud_sdk/data/.sdk-version)
          if [ "$current_version" != "$local_version" ] && [ "$(printf '%s\n' "$local_version" "$current_version" | sort -V | head -n1)" = "$local_version" ]; then
            echo "version=$current_version" >> $GITHUB_OUTPUT
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "version=$local_version" >> $GITHUB_OUTPUT
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

  update-endpoints:
    needs: check-sdk-update
    if: needs.check-sdk-update.outputs.sdk_updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Checkout TencentCloud SDK
        uses: actions/checkout@v2
        with:
          repository: TencentCloud/tencentcloud-sdk-python
          ref: master
          path: tencentcloud-sdk-python

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Update API info
        id: check-endpoints
        run: |
          python scripts/update_endpoints.py tencentcloud-sdk-python/tencentcloud src/pyqcloud_sdk/data
          # Validate endpoints.json format and content
          python -c '
          import json
          import os

          endpoints_file = "src/pyqcloud_sdk/data/endpoints.json"
          if not os.path.exists(endpoints_file):
              raise Exception("endpoints.json not found")

          with open(endpoints_file) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise Exception("Invalid endpoints.json format")

          for service, info in data.items():
              if not all(key in info for key in ["api_versions", "endpoint", "service"]):
                  raise Exception(f"Missing required fields in service {service}")
          '

      - name: Run tests
        if: ${{ success() && steps.check-endpoints.outcome != 'failure' }}
        run: |
          pip install -e .
          python -m pytest tests/

      - name: Create Pull Request
        if: ${{ success() && steps.check-endpoints.outcome != 'failure' }}
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: "chore: update API endpoints and version to ${{ needs.check-sdk-update.outputs.new_version }}"
          title: "chore: update API endpoints and version to ${{ needs.check-sdk-update.outputs.new_version }}"
          body: |
            Automatically update API endpoints data
            - SDK Version: ${{ needs.check-sdk-update.outputs.new_version }}
            - Update Time: ${{ github.event.timestamp }}

            Updates:
            1. Update endpoints.json
            2. Update version in pyproject.toml
          branch: update-endpoints
          base: main
